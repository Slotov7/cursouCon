[package]
name = "cursoucon"
version = "0.1.0"
description = "Central local de preparação para concursos"
authors = ["CursouCon"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "cursoucon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cursoucon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.5"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
